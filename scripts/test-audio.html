<!DOCTYPE html>
<html><head><meta charset="utf-8" /><title>t</title></head>
<body>
  <audio id="a" loop></audio>
<script>
window.__play = (src) => {
  const a = document.getElementById('a');
  a.src = src;
  return a.play().then(() => 'playing').catch((e) => 'play-error: ' + e.message);
};
window.__run = async (ms) => {
  const info = { tracks: 0, labels: [], rms: [] };
  try {
    const s = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 2 }, audio: true });
    const at = s.getAudioTracks();
    info.tracks = at.length;
    info.labels = at.map((t) => t.label);
    if (!at.length) return info;
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(new MediaStream(at));
    const proc = ctx.createScriptProcessor(2048, 1, 1);
    let acc = 0, n = 0;
    proc.onaudioprocess = (e) => {
      const d = e.inputBuffer.getChannelData(0);
      let sum = 0;
      for (let i = 0; i < d.length; i++) sum += d[i] * d[i];
      acc += Math.sqrt(sum / d.length);
      n++;
    };
    src.connect(proc);
    const g = ctx.createGain(); g.gain.value = 0;
    proc.connect(g); g.connect(ctx.destination);
    const chunks = [];
    const iv = setInterval(() => { chunks.push(+(acc / Math.max(1, n)).toFixed(5)); acc = 0; n = 0; }, 500);
    await new Promise((r) => setTimeout(r, ms));
    clearInterval(iv);
    info.rms = chunks;
    info.sampleRate = ctx.sampleRate;
  } catch (e) {
    info.error = e.message;
  }
  return info;
};
</script>
</body></html>
