<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="squircle" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#2C3039"/>
      <stop offset="0.55" stop-color="#15171C"/>
      <stop offset="1" stop-color="#08090B"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.34" cy="0.30" r="0.82">
      <stop offset="0" stop-color="#7BF2C0"/>
      <stop offset="1" stop-color="#20C389"/>
    </radialGradient>
  </defs>

  <!-- 底：超椭圆 -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#squircle)"/>
  <rect x="0" y="0" width="512" height="256" rx="118" fill="url(#sheen)"/>
  <rect x="2.5" y="2.5" width="507" height="507" rx="115.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.09" stroke-width="5"/>

  <!-- 主体：J（短顶横 + 竖笔 + 内卷钩） -->
  <path d="M272 160 H336 V274 A80 80 0 0 1 176 274"
        fill="none" stroke="#ffffff" stroke-width="54"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 指示灯：助手正在听 -->
  <circle cx="412" cy="252" r="26" fill="url(#lamp)"/>
</svg>
